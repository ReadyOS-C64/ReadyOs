MEMORY {
    LOADADDR: start=$DFFE, size=2, file=%O;
    UTIL: start=$E000, size=$171C, file=%O;
}
SEGMENTS {
    LOADADDR: load=LOADADDR, type=ro;
    HEADER: load=UTIL, type=ro;
    CODE: load=UTIL, type=rw;
    RODATA: load=UTIL, type=ro;
    DATA: load=UTIL, type=rw;
    BSS: load=UTIL, type=bss, define=yes;
}

MEMORY {
    APP: start = $0900, size = $7700, file = %O;
}
SEGMENTS {
    VECTORS: load = APP, type = ro;
    CODE: load = APP, type = rw;
    RODATA: load = APP, type = ro;
    DATA: load = APP, type = rw;
    BSS: load = APP, type = rw, define = yes;
    FILEREFS: load = APP, type = rw, define = yes, align = $100;
}

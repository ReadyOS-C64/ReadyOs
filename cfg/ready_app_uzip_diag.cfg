# Linker configuration for self-seeded physical uZIP probes.
#
# Diagnostics deliberately keep all phase seeds in the PRG so the codec can
# be tested without depending on the launcher resource preload path.

SYMBOLS {
    __LOADADDR__:  type = import;
    __STACKSIZE__: type = weak, value = $0200;
    __HIMEM__:     type = weak, value = $C600;
}

MEMORY {
    ZP:        file = "", start = $0002, size = $001A, type = rw, define = yes;
    LOADADDR:  file = %O, start = $0FFE, size = $0002;
    MAIN:      file = "", start = $1000, size = $B600, type = rw,
               define = yes;
    CORE:      file = %O, start = $1000, size = $2000, type = rw,
               fill = yes, define = yes;
    BSS:       file = "", start = __ONCE_RUN__ + __ONCE_SIZE__,
               size = $3000 - (__ONCE_RUN__ + __ONCE_SIZE__);
    PACK:      file = %O, start = $3000, size = $8000, type = ro,
               define = yes;
    UI:        file = "", start = $3000, size = $5000, type = rw,
               define = yes;
    UIBSS:     file = "", start = $B000, size = $1400, type = rw,
               define = yes;
    JOB:       file = "", start = $B000, size = $1400, type = rw,
               define = yes;
    JOB_MATCH: file = "", start = $B000, size = $1400, type = rw,
               define = yes;
    JOB_EMIT:  file = "", start = $B000, size = $1400, type = rw,
               define = yes;
    JOB_READ:  file = "", start = $B000, size = $1400, type = rw,
               define = yes;
    JOB_INFLATE: file = "", start = $B000, size = $1400, type = rw,
                 define = yes;
    JOB_COORD: file = "", start = $A000, size = $1000, type = rw,
               define = yes;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp;
    LOADADDR:  load = LOADADDR, type = ro;
    STARTUP:   load = CORE, type = ro;
    LOWCODE:   load = CORE, type = ro, optional = yes;
    CODE:      load = CORE, type = ro;
    RODATA:    load = CORE, type = ro;
    DATA:      load = CORE, type = rw;
    INIT:      load = CORE, type = rw, optional = yes;
    ONCE:      load = CORE, type = ro, optional = yes, define = yes;
    BSS:       load = BSS,  type = bss, define = yes;
    UI_CODE:   load = PACK, run = UI, type = ro, optional = yes, define = yes;
    UI_RODATA: load = PACK, run = UI, type = ro, optional = yes, define = yes;
    UI_BSS:    load = UIBSS, type = bss, optional = yes, define = yes;
    JOB_CODE:   load = PACK, run = JOB, type = ro, optional = yes, define = yes;
    JOB_RODATA: load = PACK, run = JOB, type = ro, optional = yes, define = yes;
    CODESEED:   load = PACK, run = JOB, type = ro, optional = yes, define = yes;
    DEFLATE_MATCH_CODE: load = PACK, run = JOB_MATCH, type = ro,
                        optional = yes, define = yes;
    DEFLATE_MATCH_RODATA: load = PACK, run = JOB_MATCH, type = ro,
                          optional = yes, define = yes;
    DEFLATE_EMIT_CODE: load = PACK, run = JOB_EMIT, type = ro,
                       optional = yes, define = yes;
    DEFLATE_EMIT_RODATA: load = PACK, run = JOB_EMIT, type = ro,
                         optional = yes, define = yes;
    DEFLATE_COORD_CODE: load = PACK, run = JOB_COORD, type = ro,
                        optional = yes, define = yes;
    DEFLATE_COORD_RODATA: load = PACK, run = JOB_COORD, type = ro,
                          optional = yes, define = yes;
    DEFLATE_COORD_BSS: load = JOB_COORD, type = bss,
                       optional = yes, define = yes;
    ZIP_READ_CODE: load = PACK, run = JOB_READ, type = ro,
                   optional = yes, define = yes;
    INFLATE_CODE: load = PACK, run = JOB_INFLATE, type = ro,
                  optional = yes, define = yes;
    INFLATE_RODATA: load = PACK, run = JOB_INFLATE, type = ro,
                    optional = yes, define = yes;
    INFLATE_BSS: load = JOB_INFLATE, type = bss,
                 optional = yes, define = yes;
}

FEATURES {
    CONDES: type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}

# Linker configuration for the Ultimate ZIP ReadyOS app.
#
# The active app owns only $1000-$C5FF. Resident transport/job coordination
# stays below $3000. Idle UI code is packed immediately after the resident
# image and runs at $3000. Phase code is linked into fixed slots in the raw
# launcher-preloaded uZPK image and is absent from uzip.prg. No file-backed
# segment crosses the ReadyOS shim at $C600.

SYMBOLS {
    __LOADADDR__:  type = import;
    __STACKSIZE__: type = weak, value = $0200;
    __HIMEM__:     type = weak, value = $C600;
}

MEMORY {
    ZP:        file = "", start = $0002, size = $001A, type = rw, define = yes;
    LOADADDR:  file = %O, start = $0FFE, size = $0002;

    # crt0 derives cc65's software-stack top from the area named MAIN. Its
    # logical extent must reach the ReadyOS shim boundary even though the
    # compact resident load image ends at $3000.
    MAIN:      file = "", start = $1000, size = $B600, type = rw,
               define = yes;
    CORE:      file = %O, start = $1000, size = $2000, type = rw,
               fill = yes, define = yes;
    BSS:       file = "", start = __ONCE_RUN__ + __ONCE_SIZE__,
               size = $3000 - (__ONCE_RUN__ + __ONCE_SIZE__);

    PACK:      file = %O, start = $3000, size = $7000, type = ro,
               define = yes;
    UI:        file = "", start = $3000, size = $7000, type = rw,
               define = yes;
    # Packed phase seeds may occupy the complete dictionary stream through
    # $AFFF. Idle-only BSS starts at $B000 so crt0 cannot clear a cold seed
    # first. Every destructive phase snapshots/restores through $C3FF, so this
    # mutually exclusive state may share the job window without surviving in
    # the active overlay image.
    UIBSS:     file = "", start = $B000, size = $1400, type = rw,
               define = yes;
    JOB:       file = "", start = $B000, size = $1400, type = rw,
               define = yes;
    # Mutually exclusive compressor images share the same 5K run window but
    # have independent packed load images and linker size symbols.
    JOB_MATCH: file = "", start = $B000, size = $1400, type = rw,
               define = yes;
    JOB_EMIT:  file = "", start = $B000, size = $1400, type = rw,
               define = yes;
    JOB_READ:  file = "", start = $B000, size = $1400, type = rw,
               define = yes;
    JOB_INFLATE: file = "", start = $B000, size = $1400, type = rw,
                 define = yes;
    # Coordinator survives MATCH/EMIT swaps and occupies the 4K immediately
    # above the 2K input block. Its cold image is packed and REU-seeded.
    JOB_COORD: file = "", start = $A000, size = $1000, type = rw,
               define = yes;
    JOB_CREATE: file = "", start = $A000, size = $1100, type = rw,
                define = yes;

    # These fixed raw areas give ld65 independent phase load addresses. The
    # release builder removes their padding and emits one compact uZPK v7
    # payload whose 64-byte header records every final REU offset and size.
    PK_HEADER: file = "bin/uzpack.raw", start = $0000, size = $0100,
               type = ro, fill = yes;
    PK_JOB:    file = "bin/uzpack.raw", start = $0100, size = $1100,
               type = ro, fill = yes;
    PK_INFLATE: file = "bin/uzpack.raw", start = $1200, size = $1000,
                type = ro, fill = yes;
    PK_MATCH:  file = "bin/uzpack.raw", start = $2200, size = $1000,
               type = ro, fill = yes;
    PK_EMIT:   file = "bin/uzpack.raw", start = $3200, size = $0D00,
               type = ro, fill = yes;
    PK_COORD:  file = "bin/uzpack.raw", start = $3F00, size = $0B00,
               type = ro, fill = yes;
    PK_READ:   file = "bin/uzpack.raw", start = $4A00, size = $1500,
               type = ro, fill = yes;
    # Creation is an extension after the frozen six-phase uZPK v7 payload.
    # It runs in the same mutually exclusive $A000 coordinator window but is
    # never described by or loaded through the v7 extraction descriptors.
    PK_CREATE: file = "bin/uzpack.raw", start = $5F00, size = $1100,
               type = ro, fill = yes;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp;
    LOADADDR:  load = LOADADDR, type = ro;
    STARTUP:   load = CORE, type = ro;
    LOWCODE:   load = CORE, type = ro, optional = yes;
    CODE:      load = CORE, type = ro;
    RODATA:    load = CORE, type = ro;
    DATA:      load = CORE, type = rw;
    INIT:      load = CORE, type = rw, optional = yes;
    ONCE:      load = CORE, type = ro, optional = yes, define = yes;
    BSS:       load = BSS,  type = bss, define = yes;

    UI_CODE:   load = PACK, run = UI, type = ro, optional = yes, define = yes;
    UI_RODATA: load = PACK, run = UI, type = ro, optional = yes, define = yes;
    UI_BSS:    load = UIBSS, type = bss, optional = yes, define = yes;

    JOB_CODE: load = PK_JOB, run = JOB, type = ro, optional = yes, define = yes;
    JOB_RODATA: load = PK_JOB, run = JOB, type = ro, optional = yes, define = yes;
    CODESEED: load = PK_JOB, run = JOB, type = ro, optional = yes, define = yes;
    INFLATE_CODE: load = PK_INFLATE, run = JOB_INFLATE, type = ro,
                  optional = yes, define = yes;
    INFLATE_RODATA: load = PK_INFLATE, run = JOB_INFLATE, type = ro,
                    optional = yes, define = yes;
    DEFLATE_MATCH_CODE: load = PK_MATCH, run = JOB_MATCH, type = ro,
                        optional = yes, define = yes;
    DEFLATE_MATCH_RODATA: load = PK_MATCH, run = JOB_MATCH, type = ro,
                          optional = yes, define = yes;
    DEFLATE_EMIT_CODE: load = PK_EMIT, run = JOB_EMIT, type = ro,
                       optional = yes, define = yes;
    DEFLATE_EMIT_RODATA: load = PK_EMIT, run = JOB_EMIT, type = ro,
                         optional = yes, define = yes;
    DEFLATE_COORD_CODE: load = PK_COORD, run = JOB_COORD, type = ro,
                        optional = yes, define = yes;
    DEFLATE_COORD_RODATA: load = PK_COORD, run = JOB_COORD, type = ro,
                          optional = yes, define = yes;
    DEFLATE_COORD_BSS: load = JOB_COORD, type = bss,
                       optional = yes, define = yes;
    ZIP_READ_CODE: load = PK_READ, run = JOB_READ, type = ro,
                   optional = yes, define = yes;
    CREATE_COORD_CODE: load = PK_CREATE, run = JOB_CREATE, type = ro,
                       optional = yes, define = yes;
    CREATE_COORD_RODATA: load = PK_CREATE, run = JOB_CREATE, type = ro,
                         optional = yes, define = yes;
    CREATE_COORD_BSS: load = JOB_CREATE, type = bss,
                      optional = yes, define = yes;
    INFLATE_BSS: load = JOB_INFLATE, type = bss,
                 optional = yes, define = yes;
}

FEATURES {
    CONDES: type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}

version: 1
kind: ultimate_task_plan
plan_id: xuzio_physical
run_mode: ultimate64
global_defaults:
  retry_policy: { max_attempts: 1, backoff_ms: 500, jitter: false }
  timeouts: { launch_s: 60, step_s: 3600, read_s: 60 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: true }
  ultimate:
    host: 10.0.0.79
    password: null
    ftp_user: anonymous
    ftp_password: anonymous@
    remote_root: USB1/READYOS_UZIP_TEST/XUZIO-RUN
    disk8: null
    disk9: null
    autostart_prg: null
    drive_a_bus_id: 8
    drive_b_bus_id: 11
    drive_a_type: '1581'
    drive_b_type: '1581'
    drive_a_enabled: false
    drive_b_enabled: false
    mount_mode: readwrite
    boot_drive: 8
    capture_video_stream: true
    stream_port: 12000
    stream_timeout_s: 4.0
    default_speed_mhz: 1
    warp_equivalent_mhz: 8
steps:
- id: launch_probe
  type: ultimate.launch
  params:
    boot_mode: prg
    prg: build/xuzio/xuzio.prg
    drives:
    - { slot: a, bus_id: 8, drive_type: '1581', enabled: false, disk: "", remote_disk: "", mount_mode: readwrite }
    - { slot: b, bus_id: 11, drive_type: '1581', enabled: false, disk: "", remote_disk: "", mount_mode: readwrite }
    boot_drive: 8
- id: wait_ready
  type: screen.wait_contains
  params: { text: "PRESS SPACE TO START", wait_timeout_s: 90, capture_label: xuzio_ready }
- id: set_test_speed
  type: ultimate.speed.set
  params: { mhz: 16 }
- id: start_at_test_speed
  type: input.key
  params: { key: 32, post_delay_s: 0.2 }
- id: wait_finished
  type: screen.wait_contains
  criticality: observe
  params: { text: "XUZIO FINISHED", wait_timeout_s: 3600, capture_label: xuzio_finished }
- id: restore_speed
  type: ultimate.speed.set
  params: { mhz: 1 }
- id: capture_final
  type: screen.capture
  criticality: observe
  params: { label: xuzio_final, note: "Physical xuzio final screen", capture_state: true }
- id: dump_results
  type: dump.memory_ranges
  criticality: observe
  params:
    ranges:
    - { label: xuzio_results_c000, start: 0xC000, end: 0xC07F }
    - { label: screen_0400, start: 0x0400, end: 0x07E7 }

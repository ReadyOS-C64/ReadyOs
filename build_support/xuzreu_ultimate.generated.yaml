version: 1
kind: ultimate_task_plan
plan_id: xuzreu_readyos_owned_bank_physical
run_mode: ultimate64
global_defaults:
  retry_policy: { max_attempts: 1, backoff_ms: 500, jitter: false }
  timeouts: { launch_s: 180, step_s: 3600, read_s: 60 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: true }
  ultimate:
    host: 10.0.0.79
    password: null
    ftp_user: anonymous
    ftp_password: anonymous@
    remote_root: USB1/READYOS_UZIP_TEST/XUZREU-RUN
    disk8: XUZREU-DIAGNOSTIC-D81
    disk9: null
    autostart_prg: null
    drive_a_bus_id: 8
    drive_b_bus_id: 11
    drive_a_type: '1581'
    drive_b_type: '1581'
    drive_a_enabled: true
    drive_b_enabled: false
    mount_mode: readwrite
    boot_drive: 8
    capture_video_stream: true
    stream_port: 12200
    stream_timeout_s: 4.0
    default_speed_mhz: 1
    warp_equivalent_mhz: 8
steps:
- id: launch_readyos_diagnostic
  type: ultimate.launch
  params:
    boot_mode: disk
    drives:
    - { slot: a, bus_id: 8, drive_type: '1581', enabled: true, disk: "XUZREU-DIAGNOSTIC-D81", remote_disk: "USB1/READYOS_UZIP_TEST/XUZREU-RUN/XUZREU.D81", image_type: d81, mount_mode: readwrite }
    boot_drive: 8
    boot_command: "LOAD\"BOOT\",8\r"
    reset_before_boot: true
    post_reset_delay_s: 3.0
    boot_inter_chunk_delay_s: 0.25
- id: wait_basic_loading_boot
  type: screen.wait_contains
  params: { text: "LOADING", wait_timeout_s: 60, poll_s: 0.5 }
- id: run_readyos_booter
  type: input.sequence
  params: { pre_delay_s: 45, keys: [82,85,78,13], inter_key_delay_s: 0.1, post_delay_s: 0.5 }
- id: wait_xuzreu_ready
  type: screen.wait_contains
  # REST screen/RAM reads can freeze an in-progress KERNAL IEC LOAD on the
  # physical Ultimate. Keep a fully quiet post-RUN window before observation.
  params: { text: "PRESS SPACE TO START", wait_timeout_s: 360, poll_s: 1.0, pre_delay_s: 180, capture_label: xuzreu_ready }
- id: set_test_speed
  type: ultimate.speed.set
  params: { mhz: 16 }
- id: start_core_at_test_speed
  type: input.key
  params: { key: 32, post_delay_s: 0.2 }
- id: wait_core_finished
  type: screen.wait_contains
  criticality: observe
  params: { text: "XUZREU FINISHED", wait_timeout_s: 3600, poll_s: 0.5, capture_label: xuzreu_core_finished }
- id: dump_core_results
  type: dump.memory_ranges
  criticality: observe
  params:
    ranges:
    - { label: xuzreu_core_c000, start: 0xC000, end: 0xC07F }
    - { label: xuzreu_core_screen_0400, start: 0x0400, end: 0x07E7 }
- id: restore_speed_after_core_observation
  type: ultimate.speed.set
  params: { mhz: 1 }
- id: assert_core_pass
  type: assert.screen
  params: { contains: "XUZREU FINISHED CORE PASS" }
- id: return_core_to_launcher
  type: input.key
  params: { key: 2, post_delay_s: 1.0 }
- id: wait_launcher_before_cross_app
  type: screen.wait_contains
  params: { text: "READY OS", wait_timeout_s: 120, poll_s: 0.5, capture_label: xuzreu_launcher_before_cross_app }
- id: launch_reuviewer
  type: input.sequence
  params: { keys: [17,17,17,17,17,13], inter_key_delay_s: 0.12, post_delay_s: 2.0 }
- id: wait_reuviewer_first
  type: screen.wait_contains
  # The test image deliberately does not depend on a configured launcher DMA
  # host path. If this cold app load falls back to KERNAL IEC, REST observation
  # must remain quiet until the PRG is fully loaded.
  params: { text: "REU MEMORY MAP", pre_delay_s: 180, wait_timeout_s: 120, poll_s: 0.5, capture_label: xuzreu_reuviewer_first }
- id: resume_test_speed_for_switch_flow
  type: ultimate.speed.set
  params: { mhz: 16 }
- id: return_reuviewer_to_launcher
  type: input.key
  params: { key: 2, post_delay_s: 1.0 }
- id: wait_launcher_before_resume
  type: screen.wait_contains
  params: { text: "READY OS", wait_timeout_s: 120, poll_s: 0.5 }
- id: resume_uzip
  type: input.sequence
  params: { keys: [145,145,145,145,145,13], inter_key_delay_s: 0.12, post_delay_s: 2.0 }
- id: wait_xuzreu_resume_finished
  type: screen.wait_contains
  criticality: observe
  params: { text: "XUZREU FINISHED", wait_timeout_s: 180, poll_s: 0.5, capture_label: xuzreu_resume_finished }
- id: dump_resume_results
  type: dump.memory_ranges
  criticality: observe
  params:
    ranges:
    - { label: xuzreu_resume_c000, start: 0xC000, end: 0xC07F }
    - { label: xuzreu_resume_screen_0400, start: 0x0400, end: 0x07E7 }
- id: restore_speed_after_resume_observation
  type: ultimate.speed.set
  params: { mhz: 1 }
- id: assert_resume_pass
  type: assert.screen
  params: { contains: "XUZREU FINISHED RESUME PASS" }
- id: resume_test_speed_for_unload_flow
  type: ultimate.speed.set
  params: { mhz: 16 }
- id: return_resume_to_launcher
  type: input.key
  params: { key: 2, post_delay_s: 1.0 }
- id: wait_launcher_before_unload
  type: screen.wait_contains
  params: { text: "READY OS", wait_timeout_s: 120, poll_s: 0.5 }
- id: unload_uzip
  type: input.key
  params: { key: 136, post_delay_s: 1.0 }
- id: wait_launcher_after_unload
  type: screen.wait_contains
  params: { text: "READY OS", wait_timeout_s: 120, poll_s: 0.5, capture_label: xuzreu_launcher_after_unload }
- id: resume_reuviewer_after_unload
  type: input.sequence
  params: { keys: [17,17,17,17,17,13], inter_key_delay_s: 0.12, post_delay_s: 2.0 }
- id: wait_reuviewer_after_unload
  type: screen.wait_contains
  params: { text: "REU MEMORY MAP", wait_timeout_s: 120, poll_s: 0.5 }
- id: select_freed_uzpk_bank
  type: input.sequence
  params: { keys: [17,17,29,29], inter_key_delay_s: 0.12, post_delay_s: 0.5 }
- id: assert_uzpk_reclaimed
  type: assert.screen
  params: { contains: "TYPE: FREE" }
- id: capture_uzpk_reclaimed
  type: screen.capture
  params: { label: xuzreu_uzpk_reclaimed, note: "Physical bank 34 is free after launcher unload", capture_state: true }
- id: restore_speed
  type: ultimate.speed.set
  params: { mhz: 1 }

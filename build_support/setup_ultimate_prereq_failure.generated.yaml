version: 1
kind: ultimate_task_plan
plan_id: readyos_setup_prerequisite_failure
run_mode: ultimate64
global_defaults:
  retry_policy: { max_attempts: 1, backoff_ms: 500, jitter: false }
  timeouts: { launch_s: 60, step_s: 180, read_s: 60 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: true }
  ultimate:
    host: 10.0.0.79
    password: null
    ftp_user: anonymous
    ftp_password: anonymous@
    remote_root: USB1/READYOS_SETUP_TEST/RUN
    disk8: build/setup_ultimate/fixture.d81
    disk9: null
    autostart_prg: null
    drive_a_bus_id: 8
    drive_b_bus_id: 11
    drive_a_type: '1581'
    drive_b_type: '1581'
    drive_a_enabled: true
    drive_b_enabled: false
    mount_mode: readwrite
    boot_drive: 8
    capture_video_stream: true
    stream_port: 11000
    stream_timeout_s: 4.0
    default_speed_mhz: 1
    warp_equivalent_mhz: 8
steps:
- id: mount_fixture
  type: ultimate.launch
  params:
    boot_mode: none
    drives:
    - slot: a
      bus_id: 8
      drive_type: '1581'
      enabled: true
      disk: build/setup_ultimate/fixture.d81
      remote_disk: USB1/READYOS_SETUP_TEST/RUN/fixture.d81
      mount_mode: readwrite
    - slot: b
      bus_id: 11
      drive_type: '1581'
      enabled: false
      disk: build/setup_ultimate/fixture.d81
      remote_disk: USB1/READYOS_SETUP_TEST/RUN/fixture.d81
      mount_mode: readwrite
    boot_drive: 8
- id: settle_reset
  type: ultimate.launch
  params:
    boot_mode: disk
    drives:
    - { slot: a, bus_id: 8, drive_type: '1581', enabled: true, disk: "", remote_disk: "", mount_mode: readwrite }
    - { slot: b, bus_id: 11, drive_type: '1581', enabled: false, disk: "", remote_disk: "", mount_mode: readwrite }
    boot_drive: 8
    boot_command: ""
    reset_before_boot: true
    post_reset_delay_s: 4.0
- id: launch_setup
  type: ultimate.launch
  params:
    boot_mode: prg
    prg: bin/setup.prg
    drives:
    - { slot: a, bus_id: 8, drive_type: '1581', enabled: true, disk: "", remote_disk: "", mount_mode: readwrite }
    - { slot: b, bus_id: 11, drive_type: '1581', enabled: false, disk: "", remote_disk: "", mount_mode: readwrite }
- id: wait_title
  type: screen.wait_contains
  params: { text: "READYOS ULTIMATE SETUP", wait_timeout_s: 90, capture_label: setup_failure_title }
- id: wait_failure_help
  type: screen.wait_contains
  params: { text: "SETUP_EXPECTED_TEXT", wait_timeout_s: 60, capture_label: setup_failure_help }
- id: capture_final
  type: screen.capture
  criticality: observe
  params: { label: setup_failure_final, note: "Verified SETUP prerequisite guidance", capture_state: true }

version: 1
kind: ultimate_task_plan
plan_id: xuzextract_transaction_physical
run_mode: ultimate64
global_defaults:
  retry_policy: { max_attempts: 1, backoff_ms: 500, jitter: false }
  timeouts: { launch_s: 60, step_s: 1800, read_s: 60 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: true }
  ultimate:
    host: 10.0.0.79
    password: null
    ftp_user: anonymous
    ftp_password: anonymous@
    remote_root: USB1/READYOS_UZIP_TEST/XUZEXTRACT-RUN
    disk8: null
    disk9: null
    autostart_prg: null
    drive_a_bus_id: 8
    drive_b_bus_id: 11
    drive_a_type: '1581'
    drive_b_type: '1581'
    drive_a_enabled: true
    drive_b_enabled: false
    mount_mode: readwrite
    boot_drive: 8
    capture_video_stream: true
    stream_port: 12240
    stream_timeout_s: 4.0
    default_speed_mhz: 1
    warp_equivalent_mhz: 8
steps:
- id: attach_to_readyos_diagnostic
  type: ultimate.launch
  params:
    boot_mode: none
    drives:
    - { slot: a, bus_id: 8, drive_type: '1581', enabled: true, disk: "", remote_disk: "", image_type: d81, mount_mode: readwrite }
    boot_drive: 8
- id: verify_xuzextract_ready
  type: screen.wait_contains
  params: { text: "PRESS SPACE TO START", wait_timeout_s: 60, poll_s: 1.0, capture_label: xuzextract_ready_at_speed }
- id: start_quiet_extraction
  type: input.key
  # No REST polling while the C64 owns UltimateDOS/UCI. The frozen physical
  # runner expands this to 900 seconds at 1 MHz; 180 seconds is retained for
  # 16/64 MHz.
  params: { key: 32, post_delay_s: 180.0 }
- id: dump_extraction_result
  type: dump.memory_ranges
  criticality: observe
  params:
    ranges:
    - { label: xuzextract_result_033c, start: 0x033C, end: 0x03BB }
    - { label: xuzextract_screen_0400, start: 0x0400, end: 0x07E7 }
- id: assert_extraction_pass
  type: assert.screen
  criticality: observe
  params: { contains: "XUZEXTRACT FINISHED PASS" }

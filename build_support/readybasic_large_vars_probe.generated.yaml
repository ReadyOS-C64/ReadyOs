      contains: "50 PRINT"
  - id: dump_after_resume_verified
    type: dump.memory_ranges
    params:
      ranges:
        - { label: basic_pnters_002b, start: 0x002B, end: 0x003F }
        - { label: basic_var_table_2b00, start: 0x2B00, end: 0x2B3F }

        - { label: basic_var_table_2b00, start: 0x2B00, end: 0x2B3F }
        - { label: basic_vars_start_1200, start: 0x1200, end: 0x1600 }
        - { label: string_heap_9f80, start: 0x9F80, end: 0x9FFF }

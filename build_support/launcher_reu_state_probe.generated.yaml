version: 1
kind: vice_task_plan
plan_id: launcher_reu_state_probe
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy:
    max_attempts: 2
    backoff_ms: 250
    jitter: false
  timeouts:
    launch_s: 45
    step_s: 180
    read_s: 2
  artifact_policy:
    capture_screen: true
    capture_state: true
    capture_dump: false
  vice:
    disk8: "Releases/0.2.5/precog-d81/readyos-v0.2.5b-d81.d81"
    disk9: "Releases/0.2.5/precog-d81/readyos-v0.2.5b-d81.d81"
    autostart_prg: "Releases/0.2.5/precog-d81/readyos-v0.2.5b-d81-preboot.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_preboot
    type: vice.launch
    params:
      kill_stale: true
  - id: wait_readybasic_prompt
    type: screen.wait_contains
    params:
      text: "readybasic"
      wait_timeout_s: 180
      capture_on_success: true
      capture_label: readybasic_initial_prompt
  - id: type_baseline_print
    type: input.sequence
    params:
      keys: [80,82,73,78,84,32,34,82,66,66,65,83,69,34,13]
      inter_key_delay_s: 0.03
      post_delay_s: 0.6
  - id: assert_baseline_print
    type: assert.screen
    params:
      contains: "RBBASE"
  - id: type_exit_readybasic
    type: input.sequence
    params:
      keys: [69,88,73,84,13]
      inter_key_delay_s: 0.03
      post_delay_s: 1.0
  - id: wait_launcher_after_exit
    type: screen.wait_contains
    params:
      text: "READY OS"
      wait_timeout_s: 45
      capture_on_success: true
      capture_label: launcher_after_readybasic_exit
  - id: dump_after_exit_ram
    type: dump.memory_ranges
    params:
      ranges: &launcher_reu_ranges
        - { label: shim_hot_state_c834, start: 0xC834, end: 0xC83F }
        - { label: shim_resident_c800, start: 0xC800, end: 0xC9FF }
        - { label: app_snapshot_private_c600, start: 0xC600, end: 0xC7FF }
  - id: dump_after_exit_reu
    type: dump.reu
    params:
      stage_tag: after_readybasic_exit
      mode: sampled
  - id: normalize_readybasic_selection
    type: input.sequence
    params:
      keys: [145,17]
      inter_key_delay_s: 0.08
      post_delay_s: 0.2
  - id: unload_selected_readybasic
    type: input.sequence
    params:
      keys: [136]
      inter_key_delay_s: 0.03
      post_delay_s: 0.8
  - id: wait_launcher_after_unload
    type: screen.wait_contains
    params:
      text: "READY OS"
      wait_timeout_s: 30
      capture_on_success: true
      capture_label: launcher_after_unload
  - id: assert_last_saved_invalidated
    type: assert.memory
    params:
      start: 0xC835
      end: 0xC835
      equals_hex: "FF"
  - id: dump_after_unload_ram
    type: dump.memory_ranges
    params:
      ranges: *launcher_reu_ranges
  - id: dump_after_unload_reu
    type: dump.reu
    params:
      stage_tag: after_readybasic_unload
      mode: sampled
  - id: reload_selected_readybasic
    type: input.sequence
    params:
      keys: [134]
      inter_key_delay_s: 0.03
      post_delay_s: 2.0
  - id: wait_reload_result
    type: screen.wait_contains
    params:
      text: "PRESS ANY KEY"
      wait_timeout_s: 90
      capture_on_success: true
      capture_label: readybasic_reload_result
  - id: dump_after_reload_ram
    type: dump.memory_ranges
    params:
      ranges: *launcher_reu_ranges
  - id: acknowledge_reload_result
    type: input.sequence
    params:
      keys: [13]
      inter_key_delay_s: 0.03
      post_delay_s: 0.6
  - id: wait_launcher_after_reload
    type: screen.wait_contains
    params:
      text: "READY OS"
      wait_timeout_s: 30
  - id: launch_reloaded_readybasic
    type: input.sequence
    params:
      keys: [145,17]
      inter_key_delay_s: 0.08
      post_delay_s: 0.3
  - id: clear_keyboard_buffer_before_relaunch
    type: memory.write
    params:
      start: 0x00C6
      bytes_hex: "00"
  # A lone RETURN immediately after a dump/reload sequence is occasionally
  # dropped by the binary-monitor key helper.  VICE's text-monitor keybuf path
  # both resumes the CPU after monitor inspection and injects it reliably.
  - id: enter_reloaded_readybasic
    type: monitor.command
    params:
      command: "keybuf \\x0d"
  - id: wait_readybasic_after_reload
    type: screen.wait_contains
    params:
      text: "READY."
      wait_timeout_s: 90
      capture_on_success: true
      capture_label: readybasic_after_reload_prompt
  - id: type_stability_print
    type: input.sequence
    params:
      keys: [80,82,73,78,84,32,34,82,66,83,84,65,66,76,69,34,13]
      inter_key_delay_s: 0.03
      post_delay_s: 0.6
  - id: assert_stability_print
    type: assert.screen
    params:
      contains: "RBSTABLE"
  - id: dump_final_ram
    type: dump.memory_ranges
    params:
      ranges:
        - { label: shim_hot_state_c834, start: 0xC834, end: 0xC83F }
        - { label: shim_resident_c800, start: 0xC800, end: 0xC9FF }
        - { label: app_snapshot_private_c600, start: 0xC600, end: 0xC7FF }
        - { label: readybasic_bridge_c000, start: 0xC000, end: 0xC5FF }
        - { label: readybasic_text_1200, start: 0x1200, end: 0x1400 }
  - id: dump_final_reu
    type: dump.reu
    params:
      stage_tag: final_readybasic_reloaded
      mode: sampled
  - id: regs_final
    type: monitor.command
    params:
      command: "r"

version: 1
kind: ultimate_task_plan
plan_id: launcher_current_screen
run_mode: ultimate64
global_defaults:
  retry_policy: { max_attempts: 1, backoff_ms: 500, jitter: false }
  timeouts: { launch_s: 60, step_s: 60, read_s: 60 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: false }
  ultimate:
    host: 10.0.0.79
    password: null
    ftp_user: anonymous
    ftp_password: anonymous@
    remote_root: USB1/READYOS_SETUP_TEST
    disk8: ""
    disk9: null
    autostart_prg: null
    drive_a_bus_id: 8
    drive_b_bus_id: 11
    drive_a_type: '1581'
    drive_b_type: '1581'
    drive_a_enabled: true
    drive_b_enabled: false
    mount_mode: readwrite
    boot_drive: 8
    capture_video_stream: true
    stream_port: 12000
    stream_timeout_s: 4.0
    default_speed_mhz: 1
    warp_equivalent_mhz: 8
steps:
- id: attach_capture_session
  type: ultimate.launch
  params:
    boot_mode: none
    drives:
    - { slot: a, bus_id: 8, drive_type: '1581', enabled: true, disk: /Users/karlprosserpp/dev/c64projects/readyosprecog/build/setup_ultimate/launcher-valid-r9.d81, remote_disk: USB1/READYOS_SETUP_TEST/LAUNCHER-VALID-R9-20260822/VALID.D81, image_type: d81, mount_mode: readwrite }
    - { slot: b, bus_id: 11, drive_type: '1581', enabled: false, disk: /Users/karlprosserpp/dev/c64projects/readyosprecog/build/setup_ultimate/launcher-valid-r9.d81, remote_disk: USB1/READYOS_SETUP_TEST/LAUNCHER-VALID-R9-20260822/VALID.D81, image_type: d81, mount_mode: readwrite }
    boot_drive: 8
- id: assert_editor_loaded
  type: assert.screen
  params: { contains: "EDITOR:" }
- id: capture_current
  type: screen.capture
  params: { label: valid_path_editor_loaded, capture_state: true }

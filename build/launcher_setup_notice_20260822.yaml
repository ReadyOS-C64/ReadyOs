version: 1
kind: ultimate_task_plan
plan_id: launcher_setup_notice
run_mode: ultimate64
global_defaults:
  retry_policy: { max_attempts: 1, backoff_ms: 500, jitter: false }
  timeouts: { launch_s: 60, step_s: 240, read_s: 60 }
  artifact_policy: { capture_screen: true, capture_state: true, capture_dump: true }
  ultimate:
    host: 10.0.0.79
    password: null
    ftp_user: anonymous
    ftp_password: anonymous@
    remote_root: USB1/READYOS_SETUP_TEST/LAUNCHER-NOTICE-20260822
    disk8: /Users/karlprosserpp/dev/c64projects/readyosprecog/Releases/0.5/precog-ultimate/readyos-v0.5-ultimate.d81
    disk9: null
    autostart_prg: null
    drive_a_bus_id: 8
    drive_b_bus_id: 11
    drive_a_type: '1581'
    drive_b_type: '1581'
    drive_a_enabled: true
    drive_b_enabled: false
    mount_mode: readwrite
    boot_drive: 8
    capture_video_stream: true
    stream_port: 12000
    stream_timeout_s: 4.0
    default_speed_mhz: 1
    warp_equivalent_mhz: 8
steps:
- id: mount_readyos
  type: ultimate.launch
  params:
    boot_mode: none
    drives:
    - slot: a
      bus_id: 8
      drive_type: '1581'
      enabled: true
      disk: /Users/karlprosserpp/dev/c64projects/readyosprecog/Releases/0.5/precog-ultimate/readyos-v0.5-ultimate.d81
      remote_disk: USB1/READYOS_SETUP_TEST/LAUNCHER-NOTICE-20260822/READYOS-ULTIMATE-NOTICE.D81
      mount_mode: readwrite
    - slot: b
      bus_id: 11
      drive_type: '1581'
      enabled: false
      disk: /Users/karlprosserpp/dev/c64projects/readyosprecog/Releases/0.5/precog-ultimate/readyos-v0.5-ultimate.d81
      remote_disk: USB1/READYOS_SETUP_TEST/LAUNCHER-NOTICE-20260822/READYOS-ULTIMATE-NOTICE.D81
      mount_mode: readwrite
    boot_drive: 8
- id: set_16mhz
  type: ultimate.speed.set
  params: { mhz: 16 }
- id: reset_to_basic
  type: ultimate.launch
  params:
    boot_mode: disk
    drives:
    - { slot: a, bus_id: 8, drive_type: '1581', enabled: true, disk: "", remote_disk: "", mount_mode: readwrite }
    - { slot: b, bus_id: 11, drive_type: '1581', enabled: false, disk: "", remote_disk: "", mount_mode: readwrite }
    boot_drive: 8
    boot_command: ""
    reset_before_boot: true
    post_reset_delay_s: 4.0
- id: wait_basic_ready
  type: screen.wait_contains
  params: { text: "READY.", wait_timeout_s: 60, pre_delay_s: 2.0 }
- id: type_boot_command
  type: input.sequence
  params:
    keys: [76,79,65,68,34,66,79,79,84,34,44,56,13,82,85,78,13]
    inter_key_delay_s: 0.08
    post_delay_s: 2.0
- id: wait_launcher
  type: screen.wait_contains
  params: { text: "APPLICATIONS:", wait_timeout_s: 240, pre_delay_s: 2.0 }
- id: wait_setup_notice
  type: screen.wait_contains
  params: { text: "RUN SETUP APP FOR FAST APP LOADING", wait_timeout_s: 60, pre_delay_s: 2.0, capture_label: launcher_setup_notice }
- id: capture_final
  type: screen.capture
  params: { label: launcher_setup_notice_final, note: "Launcher advises SETUP when DMA is configured without a path", capture_state: true }
- id: restore_1mhz
  type: ultimate.speed.set
  params: { mhz: 1 }

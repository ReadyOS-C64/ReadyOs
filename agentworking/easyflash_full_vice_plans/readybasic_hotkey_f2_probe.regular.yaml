version: 1
kind: vice_task_plan
plan_id: readybasic_hotkey_f2_probe
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy:
    max_attempts: 2
    backoff_ms: 250
    jitter: false
  timeouts:
    launch_s: 45
    step_s: 180
    read_s: 2
  artifact_policy:
    capture_screen: true
    capture_state: true
    capture_dump: false
  vice:
    disk8: "Releases/0.2.5/precog-d81/readyos-v0.2.5g-d81.d81"
    disk9: "Releases/0.2.5/precog-d81/readyos-v0.2.5g-d81.d81"
    autostart_prg: "Releases/0.2.5/precog-d81/readyos-v0.2.5g-d81-preboot.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_preboot
    type: vice.launch
    params:
      kill_stale: true
  - id: wait_readybasic_prompt
    type: screen.wait_contains
    params:
      text: "readybasic"
      wait_timeout_s: 180
      capture_label: readybasic_hotkey_f2_prompt
  - id: assert_chrin_vector_installed
    type: assert.memory
    params:
      start: 804
      end: 805
      equals_hex: "08 12"
  - id: assert_keylog_vector_installed
    type: assert.memory
    params:
      start: 655
      end: 656
      equals_hex: "7E C1"
  - id: f2_to_next_loaded_app_keylog_stub
    type: memory.write
    params:
      start: 828
      bytes_hex: "A9 01 8D 8D 02 A9 04 85 CB 20 7E C1 A9 01 8D 8D 02 A9 04 85 CB 20 7E C1 4C 74 A4"
  - id: f2_to_next_loaded_app_clear_keylog_breakpnts
    type: monitor.command
    params:
      command: "raw:delete"
  - id: f2_to_next_loaded_app
    type: monitor.command
    params:
      command: "raw:g 033c"
  - id: wait_target_after_f2
    type: screen.wait_contains
    params:
      text: "CALENDAR 26"
      wait_timeout_s: 60
      capture_label: target_after_readybasic_f2
  - id: assert_keyboard_buffer_empty_after_f2
    type: assert.memory
    params:
      start: 198
      end: 198
      equals_hex: "00"
  - id: wait_target_stable_after_f2
    type: screen.wait_contains
    params:
      text: "CALENDAR 26"
      wait_timeout_s: 30
      pre_delay_s: 2.5
      capture_label: target_stable_after_readybasic_f2
  - id: assert_keyboard_buffer_empty_stable_after_f2
    type: assert.memory
    params:
      start: 198
      end: 198
      equals_hex: "00"

version: 1
kind: vice_task_plan
plan_id: readybasic_hotkey_f2_probe_easyflash
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy:
    max_attempts: 2
    backoff_ms: 250
    jitter: false
  timeouts:
    launch_s: 45
    step_s: 180
    read_s: 2
  artifact_policy:
    capture_screen: true
    capture_state: true
    capture_dump: false
  vice:
    cart_crt: "/Users/karlprosserpp/dev/c64projects/readyosprecog/Releases/0.2.5/precog-easyflash/readyos_easyflash.crt"
    autostart_enabled: false
    disk8: "/Users/karlprosserpp/dev/c64projects/readyosprecog/agentworking/easyflash_full_vice_plans/readyos_data.easyflash-vice.d64"
    drive8_enabled: true
    drive8_type: 1541
    drive9_enabled: false
    true_drive: true
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_preboot
    type: vice.launch
    params:
      kill_stale: true
  - id: easyflash_wait_launcher
    type: screen.wait_contains
    params:
      text: "READY OS"
      pre_delay_s: 4
      poll_s: 0.5
      wait_timeout_s: 240
      capture_label: easyflash_readybasic_launcher
  - id: easyflash_start_readybasic
    type: input.sequence
    params:
      keys: [17,17,17,17,13]
      inter_key_delay_s: 0.08
      post_delay_s: 2.5
  - id: wait_readybasic_prompt
    type: screen.wait_contains
    params:
      text: "readybasic"
      wait_timeout_s: 180
      capture_label: readybasic_hotkey_f2_prompt
  - id: assert_irq_vector_installed
    type: assert.memory
    params:
      start: 788
      end: 789
      equals_hex: "00 12"
  - id: assert_keylog_vector_installed
    type: assert.memory
    params:
      start: 655
      end: 656
      equals_hex: "94 C1"
  - id: f2_to_next_loaded_app_keylog_stub
    type: memory.write
    params:
      start: 828
      bytes_hex: "A9 01 8D 8D 02 A9 04 85 CB 20 94 C1 4C CF E5"
  - id: f2_to_next_loaded_app_clear_keylog_breakpoints
    type: monitor.command
    params:
      command: "raw:delete"
  - id: f2_to_next_loaded_app_break_after_keylog
    type: monitor.command
    params:
      command: "raw:break 0348"
  - id: f2_to_next_loaded_app
    type: monitor.command
    params:
      command: "raw:g 033c"
  - id: wait_target_after_f2
    type: screen.wait_contains
    params:
      text: "CALENDAR 26"
      wait_timeout_s: 60
      capture_label: target_after_readybasic_f2
  - id: assert_keyboard_buffer_empty_after_f2
    type: assert.memory
    params:
      start: 198
      end: 198
      equals_hex: "00"

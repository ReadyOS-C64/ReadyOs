version: 1
kind: vice_task_plan
plan_id: readybasic_hotkey_f2_probe
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy:
    max_attempts: 2
    backoff_ms: 250
    jitter: false
  timeouts:
    launch_s: 45
    step_s: 180
    read_s: 2
  artifact_policy:
    capture_screen: true
    capture_state: true
    capture_dump: false
  vice:
    disk8: "Releases/0.2.5/precog-d81/readyos-v0.2.5j-d81.d81"
    disk9: "Releases/0.2.5/precog-d81/readyos-v0.2.5j-d81.d81"
    autostart_prg: "Releases/0.2.5/precog-d81/readyos-v0.2.5j-d81-preboot.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_preboot
    type: vice.launch
    params:
      kill_stale: true
  - id: wait_readybasic_prompt
    type: screen.wait_contains
    params:
      text: "readybasic"
      wait_timeout_s: 180
      capture_label: readybasic_hotkey_f2_prompt
  - id: f2_to_next_loaded_app
    type: input.sequence
    params:
      keys: [80,79,75,69,32,52,57,53,51,49,44,49,51,55,13,13]
      inter_key_delay_s: 0.03
      post_delay_s: 1.5
  - id: wait_target_after_f2
    type: screen.wait_contains
    params:
      text: "CALENDAR 26"
      wait_timeout_s: 60
      capture_label: target_after_readybasic_f2

version: 1
kind: vice_task_plan
plan_id: reuviewer_after_app_roundtrip_dump_reu_table
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy:
    max_attempts: 2
    backoff_ms: 250
    jitter: false
  timeouts:
    launch_s: 45
    step_s: 240
    read_s: 2
  artifact_policy:
    capture_screen: true
    capture_state: true
    capture_dump: false
  vice:
    disk8: "Releases/0.2.4/precog-d81/readyos-v0.2.4c-d81.d81"
    disk9: "Releases/0.2.4/precog-d81/readyos-v0.2.4c-d81.d81"
    autostart_prg: "Releases/0.2.4/precog-d81/readyos-v0.2.4c-d81-preboot.prg"
    drive8_type: 1581
    drive9_type: 1581
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_preboot
    type: vice.launch
    params:
      kill_stale: true
  - id: wait_editor_initial
    type: screen.wait_contains
    params:
      text: "editor"
      wait_timeout_s: 180
      capture_label: editor_initial
  - id: editor_touch
    type: input.sequence
    params:
      keys: [82,69,85,32,77,65,80,32,67,65,80,84,85,82,69,13]
      inter_key_delay_s: 0.035
      post_delay_s: 0.8
  - id: return_editor_to_launcher
    type: input.sequence
    params:
      keys: [2]
      inter_key_delay_s: 0.03
      post_delay_s: 1.0
  - id: wait_launcher_after_editor
    type: screen.wait_contains
    params:
      text: "READY OS"
      wait_timeout_s: 30
  - id: move_editor_to_readybasic
    type: input.sequence
    params:
      keys: [17,17,17,17,13]
      inter_key_delay_s: 0.08
      post_delay_s: 2.0
  - id: wait_readybasic
    type: screen.wait_contains
    params:
      text: "ready."
      wait_timeout_s: 90
      capture_label: readybasic_entered
  - id: readybasic_touch
    type: input.sequence
    params:
      keys: [80,82,73,78,84,32,34,82,66,79,75,34,13]
      inter_key_delay_s: 0.035
      post_delay_s: 0.8
  - id: assert_readybasic_touch
    type: assert.screen
    params:
      contains: "RBOK"
  - id: exit_readybasic
    type: input.sequence
    params:
      keys: [69,88,73,84,13]
      inter_key_delay_s: 0.035
      post_delay_s: 1.0
  - id: wait_launcher_after_readybasic
    type: screen.wait_contains
    params:
      text: "READY OS"
      wait_timeout_s: 30
  - id: move_readybasic_to_editor
    type: input.sequence
    params:
      keys: [145,145,145,145,13]
      inter_key_delay_s: 0.08
      post_delay_s: 2.0
  - id: wait_editor_after_readybasic
    type: screen.wait_contains
    params:
      text: "editor"
      wait_timeout_s: 60
      capture_label: editor_after_readybasic
  - id: return_editor_before_readyshell
    type: input.sequence
    params:
      keys: [2]
      inter_key_delay_s: 0.03
      post_delay_s: 1.0
  - id: wait_launcher_before_readyshell
    type: screen.wait_contains
    params:
      text: "READY OS"
      wait_timeout_s: 30
  - id: move_editor_to_readyshell
    type: input.sequence
    params:
      keys: [17,13]
      inter_key_delay_s: 0.08
      post_delay_s: 2.0
  - id: wait_readyshell
    type: screen.wait_contains
    params:
      text: "run: cat"
      wait_timeout_s: 120
      capture_label: readyshell_entered
  - id: readyshell_ver
    type: input.sequence
    params:
      keys: [86,69,82,13]
      inter_key_delay_s: 0.035
      post_delay_s: 1.0
  - id: assert_readyshell_ver
    type: assert.screen
    params:
      contains: "version 0.2"
  - id: return_readyshell_to_launcher
    type: monitor.command
    params:
      command: "keybuf \\x02"
  - id: wait_launcher_before_reuviewer
    type: screen.wait_contains
    params:
      text: "READY OS"
      wait_timeout_s: 90
  - id: move_readyshell_to_reuviewer
    type: input.sequence
    params:
      keys: [17,17,17,17,17,17,13]
      inter_key_delay_s: 0.08
      post_delay_s: 2.0
  - id: wait_reuviewer
    type: screen.wait_contains
    params:
      text: "REU MEMORY MAP"
      wait_timeout_s: 90
      capture_label: reuviewer_after_roundtrip
  - id: dump_reu_table
    type: dump.memory_ranges
    params:
      ranges:
        - { label: reu_alloc_table_c600, start: 0xC600, end: 0xC6FF }
        - { label: reu_sys_c700, start: 0xC700, end: 0xC73F }
        - { label: shim_reu_fields, start: 0xC836, end: 0xC83F }
  - id: capture_reuviewer_final
    type: screen.capture
    params:
      label: reuviewer_after_roundtrip_final
      note: REU Viewer after visiting Editor, ReadyBASIC, Editor, and ReadyShell.

version: 1
kind: vice_task_plan
plan_id: reuviewer_no_gap_regular_d81
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy:
    max_attempts: 1
    backoff_ms: 250
    jitter: false
  timeouts:
    launch_s: 60
    step_s: 180
    read_s: 2
  artifact_policy:
    capture_screen: true
    capture_state: true
    capture_dump: false
  vice:
    disk8: "Releases/0.2.4/precog-d81/readyos-v0.2.4h-d81.d81"
    autostart_prg: "Releases/0.2.4/precog-d81/readyos-v0.2.4h-d81-preboot.prg"
    drive8_type: 1581
    drive9_enabled: false
    true_drive: false
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_preboot
    type: vice.launch
    params:
      kill_stale: true
  - id: wait_editor_initial
    type: screen.wait_contains
    params:
      text: "F1:CPY"
      wait_timeout_s: 180
      capture_label: regular_editor_initial
  - id: return_editor_to_launcher
    type: input.sequence
    params:
      keys: [2]
      inter_key_delay_s: 0.03
      post_delay_s: 1.0
  - id: wait_launcher_after_editor
    type: screen.wait_contains
    params:
      text: "READY OS"
      wait_timeout_s: 60
      capture_label: regular_launcher_after_editor
  - id: move_to_reuviewer
    type: input.sequence
    params:
      keys: [17,17,17,17,17,17,17,13]
      inter_key_delay_s: 0.08
      post_delay_s: 2.0
  - id: wait_reuviewer
    type: screen.wait_contains
    params:
      text: "REU MEMORY MAP"
      poll_s: 0.5
      wait_timeout_s: 90
      capture_label: regular_reuviewer_entry
  - id: move_cursor_to_readyos_global
    type: input.sequence
    params:
      keys: [17,17]
      inter_key_delay_s: 0.08
      post_delay_s: 0.5
  - id: capture_reuviewer_start_row
    type: screen.capture
    params:
      label: regular_reuviewer_no_gap_start_row
      note: Regular D81 REU Viewer after loading Editor, returning to launcher, and launching REU Viewer.
  - id: move_cursor_to_launcher_bank
    type: input.sequence
    params:
      keys: [29]
      inter_key_delay_s: 0.08
      post_delay_s: 0.5
  - id: capture_reuviewer_launcher_bank
    type: screen.capture
    params:
      label: regular_reuviewer_no_gap_launcher_bank
      note: Regular D81 cursor on launcher bank; app banks begin immediately after it.

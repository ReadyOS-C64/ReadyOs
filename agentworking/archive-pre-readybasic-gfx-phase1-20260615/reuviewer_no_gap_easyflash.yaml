version: 1
kind: vice_task_plan
plan_id: reuviewer_no_gap_easyflash
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy:
    max_attempts: 1
    backoff_ms: 250
    jitter: false
  timeouts:
    launch_s: 60
    step_s: 120
    read_s: 2
  artifact_policy:
    capture_screen: true
    capture_state: true
    capture_dump: false
  vice:
    cart_crt: "/Users/karlprosserpp/dev/c64projects/readyosprecog/Releases/0.2.4/precog-easyflash/readyos_easyflash.crt"
    autostart_enabled: false
    disk8: "/Users/karlprosserpp/dev/c64projects/readyosprecog/agentworking/easyflash_full_vice_plans/readyos_data.easyflash-vice.d64"
    drive8_enabled: true
    drive8_type: 1541
    drive9_enabled: false
    true_drive: true
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_easyflash
    type: vice.launch
    params:
      kill_stale: true
  - id: wait_launcher
    type: screen.wait_contains
    params:
      text: "READY OS"
      pre_delay_s: 4
      poll_s: 0.5
      wait_timeout_s: 240
      capture_label: launcher_ready_before_reuviewer
  - id: move_to_reuviewer
    type: input.sequence
    params:
      keys: [17,17,17,17,17,17,17,13]
      inter_key_delay_s: 0.08
      post_delay_s: 2.0
  - id: wait_reuviewer
    type: screen.wait_contains
    params:
      text: "REU MEMORY MAP"
      poll_s: 0.5
      wait_timeout_s: 90
      capture_label: reuviewer_no_gap_entry
  - id: move_cursor_to_readyos_global
    type: input.sequence
    params:
      keys: [17,17]
      inter_key_delay_s: 0.08
      post_delay_s: 0.5
  - id: capture_reuviewer_start_row
    type: screen.capture
    params:
      label: reuviewer_no_gap_start_row
      note: REU Viewer row containing ReadyOS global, launcher, and first app banks.
  - id: move_cursor_to_launcher_bank
    type: input.sequence
    params:
      keys: [29]
      inter_key_delay_s: 0.08
      post_delay_s: 0.5
  - id: capture_reuviewer_launcher_bank
    type: screen.capture
    params:
      label: reuviewer_no_gap_launcher_bank
      note: Cursor on launcher bank with app banks beginning immediately after it.

version: 1
kind: vice_task_plan
plan_id: easyflash_readyshell_from_launcher
run_mode: gui_vice
global_defaults:
  monitor_host: 127.0.0.1
  monitor_port_start: 6502
  monitor_port_span: 40
  retry_policy:
    max_attempts: 1
    backoff_ms: 250
    jitter: false
  timeouts:
    launch_s: 60
    step_s: 120
    read_s: 2
  artifact_policy:
    capture_screen: true
    capture_state: true
    capture_dump: false
  vice:
    cart_crt: "/Users/karlprosserpp/dev/c64projects/readyosprecog/Releases/0.2.4/precog-easyflash/readyos_easyflash.crt"
    autostart_enabled: false
    disk8: "/Users/karlprosserpp/dev/c64projects/readyosprecog/Releases/0.2.4/precog-easyflash/readyos_data.d64"
    drive8_enabled: true
    drive8_type: 1541
    drive9_enabled: false
    true_drive: true
    close_vice: true
    headless: true
    speed_percent: 100
steps:
  - id: launch_easyflash
    type: vice.launch
    params:
      kill_stale: true
  - id: wait_launcher
    type: screen.wait_contains
    params:
      text: "READY OS"
      pre_delay_s: 4
      poll_s: 0.5
      wait_timeout_s: 240
      capture_label: easyflash_launcher_readyshell_start
  - id: navigate_to_readyshell
    type: input.sequence
    params:
      keys: [17,13]
      inter_key_delay_s: 0.08
      post_delay_s: 2.0
  - id: wait_readyshell_prompt
    type: screen.wait_contains
    params:
      text: "run: cat"
      wait_timeout_s: 120
      capture_label: easyflash_readyshell_prompt
  - id: readyshell_ver
    type: input.sequence
    params:
      keys: [86,69,82,13]
      inter_key_delay_s: 0.035
      post_delay_s: 1.0
  - id: assert_readyshell_ver
    type: assert.screen
    params:
      contains: "version 0.2"
  - id: readyshell_lst_rshelp
    type: input.sequence
    params:
      keys: [76,83,84,32,34,82,83,72,69,76,80,34,13]
      inter_key_delay_s: 0.035
      post_delay_s: 2.0
  - id: assert_readyshell_lst_rshelp
    type: screen.wait_contains
    params:
      text: "BLOCKS"
      wait_timeout_s: 90
      capture_label: easyflash_readyshell_lst_rshelp
  - id: dump_readyshell_state
    type: dump.memory_ranges
    params:
      ranges:
        - { label: shim_c800, start: 0xC800, end: 0xCA00 }
        - { label: readyshell_window, start: 0x1000, end: 0x1800 }
        - { label: readyshell_overlay_meta, start: 0xC760, end: 0xC784 }

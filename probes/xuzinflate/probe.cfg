FEATURES { STARTADDRESS: default = $0801; }
SYMBOLS {
    __LOADADDR__: type = import;
    __EXEHDR__: type = import;
    __STACKSIZE__: type = weak, value = $0C00;
    __HIMEM__: type = weak, value = $D000;
}
MEMORY {
    ZP: file = "", start = $0002, size = $001A, type = rw, define = yes;
    LOADADDR: file = %O, start = $07FF, size = $0002;
    HEADER: file = %O, start = $0801, size = $000D, type = ro, define = yes;
    # crt0 derives cc65's software-stack top from __MAIN_START__ +
    # __MAIN_SIZE__. Keep that logical extent through $D000 while placing the
    # compact load image in the overlapping LOW area.
    MAIN: file = "", start = __HEADER_LAST__,
          size = $D000 - __HEADER_LAST__, type = rw, define = yes;
    LOW: file = %O, start = __HEADER_LAST__,
         size = $3000 - __HEADER_LAST__, type = rw, fill = yes, define = yes;
    BSS: file = "", start = __ONCE_RUN__ + __ONCE_SIZE__,
         size = $2FFF - (__ONCE_RUN__ + __ONCE_SIZE__);
    DICTGAP: file = %O, start = $3000, size = $8001, type = ro, fill = yes;
    JOB: file = %O, start = $B001, size = $13FF, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR: load = HEADER, type = ro;
    STARTUP: load = LOW, type = ro;
    LOWCODE: load = LOW, type = ro, optional = yes;
    CODE: load = LOW, type = ro;
    RODATA: load = JOB, type = ro;
    DATA: load = JOB, type = rw;
    INIT: load = JOB, type = rw, optional = yes;
    ONCE: load = LOW, type = ro, optional = yes, define = yes;
    BSS: load = BSS, type = bss, define = yes;
    JOB_CODE: load = JOB, type = ro, define = yes;
    JOB_RODATA: load = JOB, type = ro, define = yes;
    JOB_BSS: load = JOB, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
}
